<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="112" viewBox="0 0 1280 112" role="img" aria-label="Gracias por visitar — Miguel Ángel Mendoza Enríquez, Desarrollador Full Stack, Ciudad de México">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="112" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1280" height="112" fill="#0a0f1a"/>
    <rect x="0" y="0" width="1280" height="4" fill="url(#bg)"/>
    <rect x="340" y="30" width="600" height="1.5" rx="1" fill="url(#tl)"/>

    <text x="640" y="62" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="700" fill="#e8eefb">Gracias por visitar mi perfil</text>
    <text x="640" y="88" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#8fa3bf" letter-spacing="1.4">MIGUEL ÁNGEL MENDOZA ENRÍQUEZ · CIUDAD DE MÉXICO, MÉXICO</text>
  </g>

  <rect x="1" y="1" width="1278" height="110" rx="15" fill="none" stroke="#94b4dc" stroke-opacity="0.18"/>
</svg>
